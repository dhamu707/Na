<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkChat - Private Room</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="welcome-container">
    <div class="logo-box">
      <i class="fa-solid fa-comments"></i>
    </div>
    <h1>LinkChat</h1>
    <p class="subtitle">ઇન્સ્ટન્ટ, પ્રાઇવેટ અને ફોટો ચેટ</p>
    <div class="action-box">
      <button id="createRoomBtn" class="primary-btn">
        <i class="fa-solid fa-plus"></i> નવો ચેટ રૂમ બનાવો
      </button>
    </div>
  </div>

  <script>
    document.getElementById('createRoomBtn').addEventListener('click', () => {
      const roomId = 'room_' + Math.random().toString(36).substring(2, 10);
      window.location.href = `chat.html?room=${roomId}`;
    });
  </script>
</body>
</html>
